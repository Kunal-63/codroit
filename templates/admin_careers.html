<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Careers</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Codroit Admin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/admin/blogs">Blogs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/admin/careers">Careers</a>
            </li>
          </ul>
          <div class="d-flex">
            <a href="/admin/logout" class="btn btn-outline-light btn-sm">Logout</a>
          </div>
        </div>
      </div>
    </nav>

    <div class="container pb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Manage Careers</h2>
        <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#createCareerModal">
          <i class="bi bi-plus-lg me-2"></i>New Opening
        </button>
      </div>

      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-4">Title</th>
                  <th>Department</th>
                  <th>Location</th>
                  <th>Type</th>
                  <th class="text-end pe-4">Actions</th>
                </tr>
              </thead>
              <tbody>
                {% for job in careers %}
                <tr>
                  <td class="ps-4 fw-medium">{{ job.title }}</td>
                  <td><span class="badge bg-secondary-subtle text-secondary">{{ job.department }}</span></td>
                  <td>{{ job.location }}</td>
                  <td>{{ job.type }}</td>
                  <td class="text-end pe-4">
                    <form method="POST" action="/admin/career/{{ job._id }}/delete" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this career opening?');">
                      <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3">Delete</button>
                    </form>
                  </td>
                </tr>
                {% else %}
                <tr>
                  <td colspan="5" class="text-center py-4 text-muted">No careers found. Create one to get started!</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Create Career Modal -->
    <div class="modal fade" id="createCareerModal" tabindex="-1" aria-labelledby="createCareerModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 rounded-4 shadow">
          <div class="modal-header border-bottom-0 pb-0">
            <h5 class="modal-title fw-bold" id="createCareerModalLabel">Add New Job Opening</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-4">
            <form method="POST" action="/admin/careers">
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label text-muted">Job Title</label>
                  <input type="text" class="form-control" name="title" required placeholder="e.g. Senior Backend Engineer">
                </div>
                <div class="col-md-6">
                  <label class="form-label text-muted">Department</label>
                  <input type="text" class="form-control" name="department" required placeholder="e.g. Engineering">
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label text-muted">Location</label>
                  <input type="text" class="form-control" name="location" required placeholder="e.g. Remote, India">
                </div>
                <div class="col-md-6">
                  <label class="form-label text-muted">Job Type</label>
                  <input type="text" class="form-control" name="type" required placeholder="e.g. Full-time">
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label text-muted">Description</label>
                <textarea class="form-control" name="description" rows="4" required placeholder="Describe the role..."></textarea>
              </div>
              <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary rounded-pill px-4">Add Opening</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
