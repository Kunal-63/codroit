<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Codroit</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  </head>
  <body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-5">
              <div class="text-center mb-4">
                <a href="/"><img src="{{ url_for('static', filename='images/Logo.png') }}" width="150" alt="Codroit Logo" class="mb-4"></a>
                <h4 class="fw-bold">Admin Login</h4>
              </div>
              
              {% if error %}
              <div class="alert alert-danger" role="alert">
                {{ error }}
              </div>
              {% endif %}

              <form method="POST" action="/admin/login">
                <div class="mb-3">
                  <label class="form-label text-muted">Username</label>
                  <input type="text" class="form-control form-control-lg rounded-3" name="username" required>
                </div>
                <div class="mb-4">
                  <label class="form-label text-muted">Password</label>
                  <input type="password" class="form-control form-control-lg rounded-3" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">Login to Dashboard</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
